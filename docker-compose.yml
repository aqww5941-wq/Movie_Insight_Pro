services:
  rabbitmq:
    image: rabbitmq:3.12-management
    container_name: movie-rabbitmq
    restart: always
    environment:
      - TZ=Asia/Shanghai
      - RABBITMQ_DEFAULT_USER=${RABBITMQ_USERNAME:-guest}
      - RABBITMQ_DEFAULT_PASS=${RABBITMQ_PASSWORD:-guest}
    ports:
      - "5672:5672"
      - "15672:15672"
    volumes:
      - ./rabbitmq_data:/var/lib/rabbitmq
    healthcheck:
      test: ["CMD", "rabbitmq-diagnostics", "-q", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

  db:
    image: pgvector/pgvector:pg15
    container_name: movie-postgres
    restart: always
    environment:
      - TZ=Asia/Shanghai
      - POSTGRES_USER=${PG_USER:-root}
      - POSTGRES_PASSWORD=${PG_PASSWORD:-000000}
      - POSTGRES_DB=${PG_DBNAME:-movie_db}
    ports:
      - "5432:5432"
    volumes:
      - ./pg_data:/var/lib/postgresql/data
      - ./db/init_sql:/docker-entrypoint-initdb.d
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${PG_USER:-root} -d ${PG_DBNAME:-movie_db}"]
      interval: 5s
      timeout: 5s
      retries: 5

  collector:
    build:
      context: ./services/collector
    container_name: scrapy_collector
    depends_on:
      db:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy
    environment:
      - TZ=Asia/Shanghai
      - PG_HOST=db
      - PG_PORT=5432
      - PG_USER=${PG_USER}
      - PG_PASSWORD=${PG_PASSWORD}
      - PG_DBNAME=${PG_DBNAME}
      - RABBITMQ_HOST=rabbitmq
      - RABBITMQ_USERNAME=${RABBITMQ_USERNAME:-guest}
      - RABBITMQ_PASSWORD=${RABBITMQ_PASSWORD:-guest}
    volumes:
      - ./services/collector:/app
      - ./data:/app/data
    tty: true
    stdin_open: true

  consumer:
    build:
      context: ./services/collector
    container_name: rabbitmq_consumer
    depends_on:
      db:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy
    environment:
      - TZ=Asia/Shanghai
      - PG_HOST=db
      - PG_PORT=5432
      - PG_USER=${PG_USER}
      - PG_PASSWORD=${PG_PASSWORD}
      - PG_DBNAME=${PG_DBNAME}
      - RABBITMQ_HOST=rabbitmq
      - RABBITMQ_USERNAME=${RABBITMQ_USERNAME:-guest}
      - RABBITMQ_PASSWORD=${RABBITMQ_PASSWORD:-guest}
      - DASHSCOPE_API_KEY=${DASHSCOPE_API_KEY}
    volumes:
      - ./services/collector:/app
      - ./data:/app/data
    command: python rabbitmq_consumer.py

  backend:
    build: ./services/backend
    container_name: movie-api
    expose:
      - "8000"
    environment:
      - TZ=Asia/Shanghai
      - PG_HOST=db
      - PG_PORT=5432
      - PG_USER=${PG_USER}
      - PG_PASSWORD=${PG_PASSWORD}
      - PG_DBNAME=${PG_DBNAME}
      - DASHSCOPE_API_KEY=${DASHSCOPE_API_KEY}
    volumes:
      - ./services/backend:/app
      - ./services/collector/utils:/app/utils
    depends_on:
      db:
        condition: service_healthy

  nginx:
    image: nginx:alpine
    container_name: movie-nginx
    ports:
      - "80:80"  # 宿主机的 80 端口指向 Nginx
    volumes:
      - ./services/nginx/nginx.conf:/etc/nginx/conf.d/default.conf:ro
      - ./services/nginx/html:/usr/share/nginx/html:ro  # 挂载前端代码
    depends_on:
      - backend
    
  redis:
    image: redis:7-alpine
    container_name: movie-redis
    ports:
      - "6379:6379"
    restart: always

