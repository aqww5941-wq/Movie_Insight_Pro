<!DOCTYPE html>
<html lang="zh">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Movie Insight Pro - AI 影评专家</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;600;700&display=swap" rel="stylesheet">
    <style>
        /* --- 全局字体与背景 --- */
        body {
            font-family: 'Inter', system-ui, -apple-system, sans-serif;
            background-color: #f8fafc;
            color: #1e293b;
            overflow-x: hidden;
        }


        /* 动态流动背景 */
        .ambient-bg {
            position: fixed;
            top: 0;
            left: 0;
            width: 100vw;
            height: 100vh;
            z-index: -1;
            background: 
                radial-gradient(at 0% 0%, hsla(253,16%,7%,1) 0, transparent 50%), 
                radial-gradient(at 50% 0%, hsla(225,39%,30%,1) 0, transparent 50%), 
                radial-gradient(at 100% 0%, hsla(339,49%,30%,1) 0, transparent 50%);
            background-size: 200% 200%;
            animation: gradientMove 15s ease infinite;
        }
        
        @keyframes gradientMove {
            0% { background-position: 0% 50%; }
            50% { background-position: 100% 50%; }
            100% { background-position: 0% 50%; }
        }

        /* --- 毛玻璃组件 --- */
        .glass-panel {
            background: rgba(255, 255, 255, 0.7);
            backdrop-filter: blur(12px);
            -webkit-backdrop-filter: blur(12px);
            border: 1px solid rgba(255, 255, 255, 0.5);
            box-shadow: 0 4px 30px rgba(0, 0, 0, 0.05);
        }

        .glass-card {
            background: rgba(255, 255, 255, 0.85);
            backdrop-filter: blur(8px);
            border: 1px solid rgba(255, 255, 255, 0.3);
            transition: all 0.4s cubic-bezier(0.175, 0.885, 0.32, 1.275);
        }

        .glass-card:hover {
            transform: translateY(-8px) scale(1.02);
            box-shadow: 0 20px 40px rgba(0, 0, 0, 0.1);
            border-color: rgba(99, 102, 241, 0.4);
            z-index: 10;
        }

        /* --- 骨架屏动画 --- */
        .skeleton {
            background: #e2e8f0;
            background: linear-gradient(110deg, #ececec 8%, #f5f5f5 18%, #ececec 33%);
            border-radius: 8px;
            background-size: 200% 100%;
            animation: 1.5s shine linear infinite;
        }
        @keyframes shine {
            to { background-position-x: -200%; }
        }

        /* --- AI 打字机光标 --- */
        .typing-cursor::after {
            content: '|';
            animation: blink 1s step-start infinite;
        }
        @keyframes blink {
            50% { opacity: 0; }
        }

        /* --- 输入框美化 --- */
        .search-input-wrapper {
            position: relative;
            transition: all 0.3s;
        }
        .search-input-wrapper:focus-within {
            transform: scale(1.01);
            box-shadow: 0 0 0 4px rgba(99, 102, 241, 0.2);
        }

        /* --- 模态框动画 --- */
        .modal {
            display: none;
            opacity: 0;
            transition: opacity 0.3s ease;
        }
        .modal.active {
            display: flex;
            opacity: 1;
        }
        .modal-content {
            transform: scale(0.95);
            transition: transform 0.3s cubic-bezier(0.34, 1.56, 0.64, 1);
        }
        .modal.active .modal-content {
            transform: scale(1);
        }
        @keyframes fadeIn {
            from {
                opacity: 0;
                transform: translateY(20px);
            }
            to {
                opacity: 1;
                transform: translateY(0);
            }
        }
    </style>
</head>
<body class="min-h-screen text-slate-800 antialiased">
    
    <div class="ambient-bg"></div>

    <div class="container mx-auto px-4 py-12 relative z-10">
        
        <div class="text-center mb-12 space-y-4">
            <div class="inline-block animate-bounce">
                <span class="text-5xl">🎬</span>
            </div>
            <h1 class="text-5xl font-extrabold text-transparent bg-clip-text bg-gradient-to-r from-white to-slate-300 drop-shadow-md tracking-tight">
                Movie Insight <span class="text-indigo-400">Pro</span>
            </h1>
            <p class="text-slate-300 text-lg max-w-2xl mx-auto font-light">
                基于向量检索与 AI 语义理解的下一代电影探索平台
            </p>
        </div>

        <div class="max-w-5xl mx-auto mb-10">
            <div class="glass-panel rounded-2xl p-6 md:p-8">
                
                <div class="search-input-wrapper flex flex-col md:flex-row gap-3 mb-6">
                    <div class="relative flex-1">
                        <div class="absolute inset-y-0 left-0 pl-4 flex items-center pointer-events-none">
                            <svg class="w-5 h-5 text-indigo-500" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M21 21l-6-6m2-5a7 7 0 11-14 0 7 7 0 0114 0z"></path></svg>
                        </div>
                        <input 
                            id="searchInput" 
                            type="text" 
                            placeholder="试试搜索：'90年代的经典科幻片' 或 '姜文导演的电影'..." 
                            class="w-full pl-12 pr-4 py-4 rounded-xl border-none bg-slate-100/50 focus:bg-white text-slate-800 placeholder-slate-400 focus:ring-0 text-lg transition shadow-inner font-medium"
                            onkeypress="if(event.key==='Enter') handleSearch()"
                        >
                    </div>
                    <button 
                        onclick="handleSearch()" 
                        class="bg-indigo-600 hover:bg-indigo-700 text-white px-8 py-3 rounded-xl font-bold text-lg shadow-lg shadow-indigo-500/30 transition transform active:scale-95 flex items-center justify-center gap-2"
                    >
                        <span>✨ 探索</span>
                    </button>
                    <button 
                        onclick="resetSearch()" 
                        class="bg-white hover:bg-slate-50 text-slate-600 border border-slate-200 px-6 py-3 rounded-xl font-semibold transition flex items-center justify-center gap-2"
                    >
                        🔄 重置
                    </button>
                </div>

                <div class="flex flex-wrap gap-3 items-center justify-between border-t border-slate-200/50 pt-5">
                    <div class="flex flex-wrap gap-3 w-full md:w-auto">
                        <select id="sourceFilter" class="bg-slate-50 border border-slate-200 text-slate-700 text-sm rounded-lg focus:ring-indigo-500 focus:border-indigo-500 block p-2.5 hover:bg-white transition cursor-pointer">
                            <option value="">📺 全部来源</option>
                            <option value="imdb">IMDB</option>
                            <option value="douban">豆瓣</option>
                            <option value="tomatoes">烂番茄</option>
                        </select>
                        
                        <input id="yearFilter" type="text" placeholder="年份 (如 2023)" class="bg-slate-50 border border-slate-200 text-slate-700 text-sm rounded-lg p-2.5 w-32 focus:outline-none focus:border-indigo-500 transition">
                        
                        <input id="minRatingFilter" type="number" step="0.1" max="10" placeholder="最低分" class="bg-slate-50 border border-slate-200 text-slate-700 text-sm rounded-lg p-2.5 w-24 focus:outline-none focus:border-indigo-500 transition">
                    </div>
                    
                    <div class="w-full md:w-auto mt-3 md:mt-0">
                        <div class="flex items-center gap-2">
                            <span class="text-sm text-slate-500">排序:</span>
                            <div class="flex bg-slate-100 rounded-lg p-1">
                                <button onclick="setSort('rating')" id="btn-rating" class="sort-btn px-3 py-1 rounded-md text-sm font-medium bg-white shadow-sm text-indigo-600 transition">评分</button>
                                <button onclick="setSort('rating_count')" id="btn-rating_count" class="sort-btn px-3 py-1 rounded-md text-sm font-medium text-slate-500 hover:text-indigo-600 transition">热度</button>
                                <button onclick="setSort('year')" id="btn-year" class="sort-btn px-3 py-1 rounded-md text-sm font-medium text-slate-500 hover:text-indigo-600 transition">年份</button>
                            </div>
                            <input type="hidden" id="sortBy" value="rating">
                        </div>
                    </div>
                </div>
            </div>
        </div>

        <div class="flex flex-wrap justify-center gap-3 mb-10">
            <button onclick="quickAsk('Top 10 经典高分电影')" class="px-4 py-2 bg-white/10 backdrop-blur-md border border-white/20 rounded-full text-white text-sm hover:bg-white/20 transition cursor-pointer">🏆 Top 10 经典</button>
            <button onclick="quickAsk('适合周末看的轻松喜剧')" class="px-4 py-2 bg-white/10 backdrop-blur-md border border-white/20 rounded-full text-white text-sm hover:bg-white/20 transition cursor-pointer">🍿 周末喜剧</button>
            <button onclick="quickAsk('烧脑反转的悬疑片')" class="px-4 py-2 bg-white/10 backdrop-blur-md border border-white/20 rounded-full text-white text-sm hover:bg-white/20 transition cursor-pointer">🧠 烧脑悬疑</button>
            <button onclick="quickAsk('视觉效果震撼的科幻片')" class="px-4 py-2 bg-white/10 backdrop-blur-md border border-white/20 rounded-full text-white text-sm hover:bg-white/20 transition cursor-pointer">🚀 硬核科幻</button>
        </div>

        <div id="aiResponseArea" class="max-w-4xl mx-auto mb-8 hidden">
            </div>

        <div id="resultInfo" class="text-center mb-8 h-6 text-slate-300 font-medium tracking-wide"></div>

        <div id="movieList" class="grid grid-cols-1 sm:grid-cols-2 lg:grid-cols-4 xl:grid-cols-5 gap-6 xl:gap-8 mb-12 min-h-[400px]">
            </div>

        <div id="pagination" class="flex justify-center items-center gap-6 mb-12"></div>

        <div id="emptyState" class="hidden text-center py-20">
            <div class="text-6xl mb-6 opacity-50">🛸</div>
            <h3 class="text-2xl font-bold text-white mb-2">在这片星系未发现目标</h3>
            <p class="text-slate-400">请尝试调整您的搜索频率或更换关键词</p>
        </div>
    </div>

    <div id="movieModal" class="modal fixed inset-0 z-50 bg-slate-900/80 backdrop-blur-sm items-center justify-center p-4">
        <div class="modal-content bg-white rounded-2xl shadow-2xl w-full max-w-4xl max-h-[90vh] overflow-hidden flex flex-col relative">
            <button onclick="closeModal()" class="absolute top-4 right-4 z-10 bg-black/20 hover:bg-black/40 text-white rounded-full p-2 transition">
                <svg class="w-6 h-6" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M6 18L18 6M6 6l12 12"></path></svg>
            </button>
            <div id="modalBody" class="overflow-y-auto h-full">
                </div>
        </div>
    </div>

    <script>
        const API_BASE_URL = window.location.origin + '/api';
        let currentPage = 1;

        window.onload = () => {
            // 默认渲染骨架屏，模拟高级感加载
            renderSkeleton(10);
            fetchMovies();
        };

        // ========== 交互逻辑 ==========
        
        function setSort(type) {
            document.getElementById('sortBy').value = type;
            // 更新按钮样式
            document.querySelectorAll('.sort-btn').forEach(btn => {
                btn.className = 'sort-btn px-3 py-1 rounded-md text-sm font-medium text-slate-500 hover:text-indigo-600 transition';
                if(btn.id === `btn-${type}`) {
                    btn.className = 'sort-btn px-3 py-1 rounded-md text-sm font-medium bg-white shadow-sm text-indigo-600 transition';
                }
            });
            handleSearch();
        }

        function quickAsk(query) {
            document.getElementById('searchInput').value = query;
            askAI(query);
        }

        function handleSearch() {
            const query = document.getElementById('searchInput').value.trim();
            const isConversational = /\?|推荐|对比|什么|哪些|怎么样|类似|最好|最新|温馨|感人|搞笑|悬疑|科幻|动作|Top/.test(query);
            
            if (isConversational) {
                askAI(query);
            } else {
                currentPage = 1;
                fetchMovies(1);
            }
        }

        function resetSearch() {
            document.getElementById('searchInput').value = '';
            document.getElementById('sourceFilter').value = '';
            document.getElementById('yearFilter').value = '';
            document.getElementById('minRatingFilter').value = '';
            setSort('rating'); // 重置排序UI
            document.getElementById('aiResponseArea').classList.add('hidden');
            fetchMovies(1);
        }

        // ========== 核心 API 调用 ==========

        async function askAI(question) {
            renderSkeleton(5); // AI 思考时显示骨架
            hideAIResponse();
            
            try {
                const response = await fetch(`${API_BASE_URL}/agent/chat`, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ query: question })
                });
                
                const data = await response.json();
                
                if (response.ok && data.status === "success") {
                    typewriterEffect(data.agent_answer); // 打字机特效
                    
                    if (data.movie_titles && data.movie_titles.length > 0) {
                        renderMovies(data.movie_titles, data.movie_titles.length);
                        document.getElementById('resultInfo').innerHTML = `🤖 AI 精选推荐 · ${data.movie_titles.length} 部影片`;
                    } else {
                        showEmpty();
                    }
                    document.getElementById('pagination').innerHTML = '';
                } else {
                    showError(data.detail || 'AI 暂时离线');
                }
            } catch (error) {
                showError(error.message);
            }
        }

        async function fetchMovies(page = 1) {
            renderSkeleton(10); // 加载时显示骨架
            hideAIResponse();
            
            const params = new URLSearchParams({
                page: page,
                limit: 20,
            });

            // 收集参数
            const q = document.getElementById('searchInput').value.trim();
            if (q) params.append('q', q);
            const source = document.getElementById('sourceFilter').value;
            if (source) params.append('source', source);
            const year = document.getElementById('yearFilter').value.trim();
            if (year) params.append('year', year);
            const minRating = document.getElementById('minRatingFilter').value;
            if (minRating) params.append('min_rating', minRating);
            const sortBy = document.getElementById('sortBy').value;
            params.append('sort_by', sortBy); // 确保传给后端

            try {
                const response = await fetch(`${API_BASE_URL}/movies?${params}`);
                const data = await response.json();
                
                if (response.ok) {
                    currentPage = data.page;
                    if (data.items.length === 0 && q) {
                        await askAI(q); // 自动降级为 AI
                    } else {
                        renderMovies(data.items, data.total);
                        renderPagination(data);
                    }
                } else {
                    showError('请求失败');
                }
            } catch (error) {
                showError(error.message);
            }
        }

        // ========== 渲染逻辑 ==========

        function renderSkeleton(count) {
            const list = document.getElementById('movieList');
            list.classList.remove('hidden');
            document.getElementById('emptyState').classList.add('hidden');
            
            let html = '';
            for(let i=0; i<count; i++) {
                html += `
                    <div class="bg-white rounded-2xl overflow-hidden shadow-sm border border-slate-100">
                        <div class="skeleton h-[300px] w-full"></div>
                        <div class="p-4 space-y-3">
                            <div class="skeleton h-6 w-3/4 rounded"></div>
                            <div class="flex gap-2">
                                <div class="skeleton h-4 w-12 rounded"></div>
                                <div class="skeleton h-4 w-12 rounded"></div>
                            </div>
                        </div>
                    </div>
                `;
            }
            list.innerHTML = html;
        }

        function renderMovies(movies, total) {
            const list = document.getElementById('movieList');
            if (!movies || movies.length === 0) {
                showEmpty();
                return;
            }

            if (!document.getElementById('resultInfo').innerHTML.includes('AI')) {
                document.getElementById('resultInfo').innerHTML = `✨ 发现 ${total} 部相关影片`;
            }

            list.innerHTML = movies.map((movie, index) => `
                <div class="glass-card rounded-2xl overflow-hidden cursor-pointer flex flex-col h-full opacity-0 animate-[fadeIn_0.5s_ease-out_forwards]" 
                     style="animation-delay: ${index * 0.05}s"
                     onclick="showMovieDetail(${movie.id})">
                    
                    <div class="relative aspect-[2/3] overflow-hidden group">
                        <img 
                            src="${movie.cover_url || ''}" 
                            class="w-full h-full object-cover transition duration-700 group-hover:scale-110"
                            onerror="this.src='https://placehold.co/400x600/e2e8f0/94a3b8?text=No+Image'"
                        >
                        <div class="absolute top-2 right-2">
                            <div class="bg-white/90 backdrop-blur text-indigo-700 text-xs font-bold px-2 py-1 rounded-lg shadow-sm">
                                ${movie.rating ? `⭐ ${movie.rating}` : '暂无评分'}
                            </div>
                        </div>
                        <div class="absolute inset-0 bg-gradient-to-t from-black/60 to-transparent opacity-0 group-hover:opacity-100 transition duration-300 flex items-end p-4">
                            <span class="text-white font-medium text-sm">查看详情 →</span>
                        </div>
                    </div>
                    
                    <div class="p-5 flex-1 flex flex-col">
                        <div class="flex items-center gap-2 mb-2">
                            <span class="px-2 py-0.5 rounded text-[10px] font-bold tracking-wider uppercase bg-indigo-50 text-indigo-600 border border-indigo-100">
                                ${movie.source || 'WEB'}
                            </span>
                            <span class="text-slate-400 text-xs">${movie.year || ''}</span>
                        </div>
                        
                        <h3 class="font-bold text-slate-800 text-lg leading-tight mb-2 line-clamp-2" title="${movie.title}">
                            ${movie.title}
                        </h3>
                        
                        <div class="mt-auto pt-3 border-t border-slate-100 text-xs text-slate-500 flex justify-between items-center">
                            <span>${movie.director ? movie.director.split('/')[0] : '未知导演'}</span>
                        </div>
                    </div>
                </div>
            `).join('');
        }

        // AI 打字机特效
        function typewriterEffect(text) {
            const container = document.getElementById('aiResponseArea');
            container.classList.remove('hidden');
            container.innerHTML = `
                <div class="bg-white/90 backdrop-blur-xl border border-indigo-100 rounded-2xl p-6 shadow-xl relative overflow-hidden">
                    <div class="absolute top-0 left-0 w-1 h-full bg-indigo-500"></div>
                    <div class="flex gap-3 mb-4">
                        <div class="w-10 h-10 rounded-full bg-indigo-100 flex items-center justify-center text-xl">🤖</div>
                        <div>
                            <h4 class="font-bold text-slate-800">AI 影评专家</h4>
                            <p class="text-xs text-slate-500">基于语义理解分析</p>
                        </div>
                    </div>
                    <div class="prose prose-indigo max-w-none text-slate-700 leading-relaxed" id="aiTextOutput"></div>
                </div>
            `;
            
            const output = document.getElementById('aiTextOutput');
            const cleanText = text.replace(/\*\*(.*?)\*\*/g, '<strong>$1</strong>'); // 预处理加粗
            
            // 简单模拟打字，如果是 HTML 结构太复杂建议直接显示
            // 这里为了效果我们快速显示内容
            output.innerHTML = cleanText;
            output.classList.add('animate-[fadeIn_1s_ease]');
        }

        function renderPagination(data) {
            const pagination = document.getElementById('pagination');
            if (data.total_pages <= 1) {
                pagination.innerHTML = '';
                return;
            }
            
            pagination.innerHTML = `
                <button onclick="fetchMovies(${data.page - 1})" ${data.page <= 1 ? 'disabled' : ''} class="w-10 h-10 rounded-full bg-white text-slate-600 hover:bg-indigo-600 hover:text-white shadow transition flex items-center justify-center disabled:opacity-50 disabled:hover:bg-white disabled:hover:text-slate-600">
                    <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M15 19l-7-7 7-7"></path></svg>
                </button>
                <span class="px-4 font-medium text-slate-400">Page ${data.page} / ${data.total_pages}</span>
                <button onclick="fetchMovies(${data.page + 1})" ${data.page >= data.total_pages ? 'disabled' : ''} class="w-10 h-10 rounded-full bg-white text-slate-600 hover:bg-indigo-600 hover:text-white shadow transition flex items-center justify-center disabled:opacity-50 disabled:hover:bg-white disabled:hover:text-slate-600">
                    <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M9 5l7 7-7 7"></path></svg>
                </button>
            `;
        }

        // 详情弹窗
        async function showMovieDetail(movieId) {
            const modal = document.getElementById('movieModal');
            const body = document.getElementById('modalBody');
            modal.classList.add('active');
            body.innerHTML = `
                <div class="h-96 w-full bg-slate-100 animate-pulse"></div>
            `; // 弹窗骨架

            try {
                const res = await fetch(`${API_BASE_URL}/movies/${movieId}`);
                const movie = await res.json();
                
                body.innerHTML = `
                    <div class="flex flex-col md:flex-row h-full">
                        <div class="w-full md:w-2/5 h-64 md:h-auto bg-slate-200 relative">
                            <img src="${movie.cover_url}" class="w-full h-full object-cover absolute inset-0" onerror="this.parentElement.innerHTML='<div class=\\'flex items-center justify-center h-full text-slate-400\\'>暂无封面</div>'">
                            <div class="absolute inset-0 bg-gradient-to-t from-black/80 via-transparent to-transparent md:hidden"></div>
                        </div>
                        <div class="flex-1 p-8 bg-white overflow-y-auto">
                            <div class="flex items-start justify-between mb-4">
                                <div>
                                    <h2 class="text-3xl font-bold text-slate-900 mb-2">${movie.title}</h2>
                                    <div class="flex flex-wrap gap-2 text-sm">
                                        <span class="px-2 py-1 bg-indigo-100 text-indigo-700 rounded font-semibold">${movie.year}</span>
                                        <span class="px-2 py-1 bg-slate-100 text-slate-600 rounded">${movie.source.toUpperCase()}</span>
                                    </div>
                                </div>
                                ${movie.rating ? `<div class="bg-indigo-600 text-white px-4 py-3 rounded-xl text-center shadow-lg"><div class="text-2xl font-bold">${movie.rating}</div><div class="text-xs opacity-80">评分</div></div>` : ''}
                            </div>
                            
                            <div class="space-y-6">
                                ${movie.summary ? `<p class="text-slate-600 leading-relaxed text-lg">${movie.summary}</p>` : '<p class="text-slate-400 italic">暂无剧情简介...</p>'}
                                
                                <div class="grid grid-cols-2 gap-4 text-sm border-t pt-6">
                                    <div>
                                        <span class="block text-slate-400 mb-1">导演</span>
                                        <span class="font-medium text-slate-800">${movie.director || '未知'}</span>
                                    </div>
                                    <div>
                                        <span class="block text-slate-400 mb-1">主演</span>
                                        <span class="font-medium text-slate-800 truncate block" title="${movie.stars}">${movie.stars || '未知'}</span>
                                    </div>
                                </div>

                                <a href="${movie.url || '#'}" target="_blank" class="block w-full text-center bg-slate-900 hover:bg-indigo-600 text-white py-4 rounded-xl font-bold transition shadow-lg transform active:scale-95">
                                    🔗 前往源网站查看完整信息
                                </a>
                            </div>
                        </div>
                    </div>
                `;
            } catch (e) {
                body.innerHTML = `<div class="p-8 text-center text-red-500">加载失败</div>`;
            }
        }

        function closeModal() {
            document.getElementById('movieModal').classList.remove('active');
        }

        function hideAIResponse() {
            document.getElementById('aiResponseArea').classList.add('hidden');
        }
        function showEmpty() {
            document.getElementById('movieList').innerHTML = '';
            document.getElementById('emptyState').classList.remove('hidden');
        }
        function showError(msg) {
            document.getElementById('resultInfo').innerHTML = `<span class="text-red-400">❌ ${msg}</span>`;
            document.getElementById('movieList').innerHTML = '';
        }
    </script>
</body>
</html>
