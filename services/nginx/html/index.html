<!DOCTYPE html>
<html lang="zh">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>电影 AI 助手 - 完整版</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        .movie-card {
            cursor: pointer;
            transition: all 0.3s ease;
        }
        .movie-card:hover {
            transform: translateY(-5px);
            box-shadow: 0 10px 25px rgba(0,0,0,0.15);
        }
        .rating-badge {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
        }
        .pagination-btn:disabled {
            opacity: 0.5;
            cursor: not-allowed;
        }
        .movie-cover {
            width: 100%;
            height: 300px;
            object-fit: cover;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
        }
        .movie-cover-placeholder {
            width: 100%;
            height: 300px;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 4rem;
        }
        .modal {
            display: none;
            animation: fadeIn 0.3s;
        }
        .modal.active {
            display: flex;
        }
        @keyframes fadeIn {
            from { opacity: 0; }
            to { opacity: 1; }
        }
        .modal-content {
            animation: slideUp 0.3s;
        }
        @keyframes slideUp {
            from { transform: translateY(50px); opacity: 0; }
            to { transform: translateY(0); opacity: 1; }
        }
        .img-error {
            display: none;
        }
        
        /* AI 相关样式 */
        .ai-response-card {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            border-radius: 1rem;
            padding: 2rem;
            color: white;
            margin-bottom: 2rem;
            box-shadow: 0 10px 30px rgba(102, 126, 234, 0.3);
            animation: slideIn 0.5s ease-out;
        }
        @keyframes slideIn {
            from {
                opacity: 0;
                transform: translateY(-20px);
            }
            to {
                opacity: 1;
                transform: translateY(0);
            }
        }
        .ai-badge {
            display: inline-flex;
            align-items: center;
            gap: 0.5rem;
            background: rgba(255, 255, 255, 0.2);
            backdrop-filter: blur(10px);
            padding: 0.5rem 1rem;
            border-radius: 2rem;
            font-weight: 600;
            margin-bottom: 1rem;
        }
        .ai-thinking {
            display: inline-block;
            animation: pulse 1.5s ease-in-out infinite;
        }
        @keyframes pulse {
            0%, 100% { opacity: 1; }
            50% { opacity: 0.5; }
        }
        
        /* 快捷功能按钮 */
        .quick-action {
            transition: all 0.3s;
        }
        .quick-action:hover {
            transform: translateY(-2px);
            box-shadow: 0 4px 12px rgba(102, 126, 234, 0.3);
        }
    </style>
</head>
<body class="bg-gradient-to-br from-blue-50 to-indigo-100 min-h-screen">
    <div class="container mx-auto px-4 py-8">
        <!-- 页面标题 -->
        <h1 class="text-4xl font-bold text-center mb-2 text-indigo-600">🎬 AI 电影智能助手</h1>
        <p class="text-center text-gray-600 mb-8">智能搜索 · AI 推荐 · 自动展示推荐结果</p>

        <!-- 快捷 AI 功能 -->
        <div class="max-w-4xl mx-auto mb-6">
            <div class="bg-white rounded-xl shadow-lg p-6">
                <h3 class="font-bold text-gray-700 mb-4">⚡ 快捷功能</h3>
                <div class="grid grid-cols-2 md:grid-cols-4 gap-3">
                    <button onclick="askAI('推荐评分最高的 5 部电影')" class="quick-action bg-indigo-50 hover:bg-indigo-100 text-indigo-700 p-4 rounded-lg font-medium">
                        🏆 Top 5 佳片
                    </button>
                    <button onclick="askAI('推荐温馨的电影')" class="quick-action bg-purple-50 hover:bg-purple-100 text-purple-700 p-4 rounded-lg font-medium">
                        💝 温馨电影
                    </button>
                    <button onclick="askAI('推荐科幻片')" class="quick-action bg-blue-50 hover:bg-blue-100 text-blue-700 p-4 rounded-lg font-medium">
                        🚀 科幻推荐
                    </button>
                    <button onclick="askAI('推荐悬疑烧脑的电影')" class="quick-action bg-green-50 hover:bg-green-100 text-green-700 p-4 rounded-lg font-medium">
                        🧠 烧脑悬疑
                    </button>
                </div>
            </div>
        </div>

        <!-- 搜索栏 -->
        <div class="max-w-2xl mx-auto mb-8">
            <div class="bg-white rounded-xl shadow-lg p-4">
                <div class="flex gap-2 mb-4">
                    <input 
                        id="searchInput" 
                        type="text" 
                        placeholder="搜索电影或向 AI 提问..." 
                        class="flex-1 px-4 py-3 rounded-lg border-2 border-indigo-200 focus:border-indigo-500 focus:outline-none transition"
                        onkeypress="if(event.key==='Enter') handleSearch()"
                    >
                    <button 
                        onclick="handleSearch()" 
                        class="bg-indigo-500 text-white px-8 py-3 rounded-lg hover:bg-indigo-600 font-semibold transition"
                    >
                        🔍 搜索
                    </button>
                    <button 
                        onclick="resetSearch()" 
                        class="bg-gray-200 text-gray-700 px-6 py-3 rounded-lg hover:bg-gray-300 font-semibold transition"
                    >
                        🔄 重置
                    </button>
                </div>

                <!-- 高级筛选 -->
                <div class="grid grid-cols-2 md:grid-cols-4 gap-3">
                    <select id="sourceFilter" class="px-3 py-2 rounded-lg border border-gray-300 focus:border-indigo-500 focus:outline-none">
                        <option value="">全部来源</option>
                        <option value="imdb">IMDB</option>
                        <option value="douban">豆瓣</option>
                        <option value="tomatoes">Rotten Tomatoes</option>
                    </select>
                    
                    <input 
                        id="yearFilter" 
                        type="text" 
                        placeholder="年份 (如: 2008)" 
                        class="px-3 py-2 rounded-lg border border-gray-300 focus:border-indigo-500 focus:outline-none"
                    >
                    
                    <input 
                        id="minRatingFilter" 
                        type="number" 
                        step="0.1" 
                        min="0" 
                        max="10" 
                        placeholder="最低评分" 
                        class="px-3 py-2 rounded-lg border border-gray-300 focus:border-indigo-500 focus:outline-none"
                    >
                    
                    <select id="sortBy" class="px-3 py-2 rounded-lg border border-gray-300 focus:border-indigo-500 focus:outline-none">
                        <option value="rating">按评分排序</option>
                        <option value="rating_count">按热度排序</option>
                        <option value="year">按年份排序</option>
                    </select>
                </div>
            </div>
        </div>

        <!-- AI 推荐说明区域 -->
        <div id="aiResponseArea" class="max-w-4xl mx-auto mb-6" style="display: none;">
            <!-- AI 回复内容将动态插入这里 -->
        </div>

        <!-- 结果统计 -->
        <div id="resultInfo" class="text-center mb-6 text-gray-700 font-medium"></div>

        <!-- 电影列表 -->
        <div id="movieList" class="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-4 xl:grid-cols-5 gap-6 mb-8">
            <!-- 电影卡片将动态插入这里 -->
        </div>

        <!-- 分页控件 -->
        <div id="pagination" class="flex justify-center items-center gap-4 mb-8">
            <!-- 分页按钮将动态插入这里 -->
        </div>

        <!-- 加载状态 -->
       <div id="loading" class="hidden text-center py-12">
            <div class="inline-block animate-spin rounded-full h-12 w-12 border-4 border-indigo-500 border-t-transparent"></div>
            <div class="mt-4 text-gray-600 font-medium space-y-1">
                <p>AI 正在检索向量库...</p>
                <p class="text-xs text-gray-400">正在生成 1536 维语义特征并匹配 HNSW 索引</p>
            </div>
        </div>

        <!-- 空状态 -->
        <div id="emptyState" class="hidden text-center py-12">
            <div class="text-6xl mb-4">🎬</div>
            <h3 class="text-xl font-semibold text-gray-700 mb-2">未找到相关电影</h3>
            <p class="text-gray-500">试试调整搜索条件或使用不同的关键词</p>
        </div>
    </div>

    <!-- 电影详情弹窗 -->
    <div id="movieModal" class="modal fixed inset-0 bg-black bg-opacity-60 z-50 items-center justify-center p-4">
        <div class="modal-content bg-white rounded-2xl max-w-4xl w-full max-h-[90vh] overflow-y-auto">
            <div class="sticky top-0 bg-white border-b px-6 py-4 flex justify-between items-center z-10">
                <h2 class="text-2xl font-bold text-gray-800">电影详情</h2>
                <button onclick="closeModal()" class="text-gray-500 hover:text-gray-700 text-3xl leading-none">&times;</button>
            </div>
            <div id="modalBody" class="p-6">
                <!-- 详情内容将动态插入这里 -->
            </div>
        </div>
    </div>

    <script>
        const API_BASE_URL = window.location.origin + '/api';
        
        let currentPage = 1;
        let totalPages = 1;

        window.onload = () => {
            fetchMovies();
        };

        // ========== 智能搜索处理 ==========
        
        function handleSearch() {
            const query = document.getElementById('searchInput').value.trim();
            
            if (!query) {
                fetchMovies(1);
                return;
            }

            // 判断是否为对话式查询（包含问号、"推荐"、"对比"等关键词）
            const isConversational = /\?|推荐|对比|什么|哪些|怎么样|类似|最好|最新|温馨|感人|搞笑|悬疑|科幻|动作/.test(query);
            
            if (isConversational) {
                // 使用 AI 模式
                askAI(query);
            } else {
                // 使用普通搜索
                currentPage = 1;
                fetchMovies(1);
            }
        }

        // ========== AI 推荐核心功能 ==========
        
        async function askAI(question) {
            showLoading(true);
            hideAIResponse();
            
            try {
                const response = await fetch(`${API_BASE_URL}/agent/chat`, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ query: question })
                });
                
                const data = await response.json();
                
                if (response.ok && data.status === "success") {
                    // 显示 AI 的文字推荐说明
                    displayAIExplanation(data.agent_answer, question);
                    
                    // 关键：根据 AI 返回的电影标题/ID 去获取并展示电影卡片
                    if (data.movie_titles && data.movie_titles.length > 0) {
                        // 方案1：AI 返回电影标题列表，前端搜索这些电影
                        await fetchMoviesByTitles(data.movie_titles);
                    } else if (data.movie_ids && data.movie_ids.length > 0) {
                        // 方案2：AI 返回电影 ID 列表，前端直接获取
                        await fetchMoviesByIds(data.movie_ids);
                    } else {
                        // 方案3：从 AI 的回复中解析电影名称
                        const extractedTitles = extractMovieTitlesFromText(data.agent_answer);
                        if (extractedTitles.length > 0) {
                            await fetchMoviesByTitles(extractedTitles);
                        } else {
                            showNoMoviesFound();
                        }
                    }
                    document.getElementById('pagination').innerHTML = '';
                } else {
                    showError(data.detail || 'AI 推荐失败');
                }
            } catch (error) {
                showError(`AI 服务错误: ${error.message}`);
            } finally {
                showLoading(false);
            }
        }

        // 显示 AI 的推荐说明
        // static/index.html

        function displayAIExplanation(aiAnswer, userQuery) {
            const aiArea = document.getElementById('aiResponseArea');
            aiArea.style.display = 'block';
            
            // 增强版替换逻辑：处理换行、加粗和列表
            const formattedAnswer = aiAnswer
                .replace(/\n/g, '<br>')
                .replace(/\*\*([^*]+)\*\*/g, '<strong>$1</strong>')
                .replace(/^\d\.\s/gm, '• '); // 将数字列表转为圆点，视觉更统一

            aiArea.innerHTML = `
                <div class="ai-response-card bg-white border-l-4 border-indigo-500 p-6 rounded-xl shadow-md mb-6 animate-fade-in">
                    <div class="flex items-center gap-2 mb-3">
                        <span class="text-2xl">🤖</span>
                        <span class="font-bold text-indigo-700">AI 影评专家</span>
                    </div>
                    <div class="text-gray-700 text-lg leading-relaxed italic">
                        ${formattedAnswer}
                    </div>
                </div>
            `;
        }

        // 从 AI 文本中提取电影名称（正则匹配）
        function extractMovieTitlesFromText(text) {
            const titles = [];
            
            // 匹配 《电影名》 格式
            const regex1 = /《([^》]+)》/g;
            let match;
            while ((match = regex1.exec(text)) !== null) {
                titles.push(match[1]);
            }
            
            // 匹配 **电影名** 格式
            const regex2 = /\*\*([^*]+)\*\*/g;
            while ((match = regex2.exec(text)) !== null) {
                const title = match[1].replace(/^《|》$/g, ''); // 去掉可能存在的书名号
                if (!titles.includes(title)) {
                    titles.push(title);
                }
            }
            
            console.log('提取到的电影名称:', titles);
            return titles;
        }

        // 根据电影标题列表搜索电影
        async function fetchMoviesByTitles(titles) {
            try {
                const movies = [];
                
                // 为每个标题搜索电影
                for (const title of titles) {
                    const response = await fetch(`${API_BASE_URL}/movies?q=${encodeURIComponent(title)}&limit=1`);
                    const data = await response.json();
                    
                    if (data.items && data.items.length > 0) {
                        movies.push(data.items[0]);
                    }
                }
                
                if (movies.length > 0) {
                    renderMovies(movies, movies.length);
                    document.getElementById('resultInfo').innerHTML = 
                        `<span class="text-indigo-600">🤖 AI 为您推荐了 ${movies.length} 部电影</span>`;
                } else {
                    showNoMoviesFound();
                }
            } catch (error) {
                console.error('获取电影失败:', error);
                showError('获取推荐电影失败');
            }
        }

        // 根据电影 ID 列表获取电影
        async function fetchMoviesByIds(movieIds) {
            try {
                const promises = movieIds.map(id => 
                    fetch(`${API_BASE_URL}/movies/${id}`).then(r => r.json())
                );
                const movies = await Promise.all(promises);
                
                if (movies.length > 0) {
                    renderMovies(movies, movies.length);
                    document.getElementById('resultInfo').innerHTML = 
                        `<span class="text-indigo-600">🤖 AI 为您推荐了 ${movies.length} 部电影</span>`;
                } else {
                    showNoMoviesFound();
                }
            } catch (error) {
                console.error('获取电影详情失败:', error);
                showError('获取推荐电影失败');
            }
        }

        function showNoMoviesFound() {
            document.getElementById('resultInfo').innerHTML = 
                `<span class="text-orange-600">⚠️ AI 已回复，但暂未找到对应的电影数据</span>`;
            document.getElementById('movieList').innerHTML = '';
        }

        function hideAIResponse() {
            const aiArea = document.getElementById('aiResponseArea');
            aiArea.style.display = 'none';
            aiArea.innerHTML = '';
        }

        // ========== 普通搜索功能 ==========
        
        async function fetchMovies(page = 1) {
            showLoading(true);
            hideAIResponse();
            
            const params = new URLSearchParams({
                page: page,
                limit: 20,
                order: 'desc'
            });

            const keyword = document.getElementById('searchInput').value.trim();
            if (keyword) params.append('q', keyword);

            const source = document.getElementById('sourceFilter').value;
            if (source) params.append('source', source);

            const year = document.getElementById('yearFilter').value.trim();
            if (year) params.append('year', year);

            const minRating = document.getElementById('minRatingFilter').value;
            if (minRating) params.append('min_rating', minRating);

            const sortBy = document.getElementById('sortBy').value;
            if (sortBy) params.append('sort_by', sortBy);

            try {
                const response = await fetch(`${API_BASE_URL}/movies?${params}`);
                const data = await response.json();
                
                if (response.ok) {
                    currentPage = data.page;
                    totalPages = data.total_pages;
                    
                    // 如果搜索无结果且有关键词，自动调用 AI
                    if (data.items.length === 0 && keyword) {
                        await askAI(keyword);
                    } else {
                        renderMovies(data.items, data.total);
                        renderPagination(data);
                    }
                } else {
                    showError(data.detail || '查询失败');
                }
            } catch (error) {
                showError(`网络错误: ${error.message}`);
            } finally {
                showLoading(false);
            }
        }

        function resetSearch() {
            document.getElementById('searchInput').value = '';
            document.getElementById('sourceFilter').value = '';
            document.getElementById('yearFilter').value = '';
            document.getElementById('minRatingFilter').value = '';
            document.getElementById('sortBy').value = 'rating';
            currentPage = 1;
            hideAIResponse();
            fetchMovies(1);
        }

        // ========== 电影渲染 ==========
        
        function handleImageError(img) {
            img.style.display = 'none';
            img.nextElementSibling.style.display = 'flex';
        }

        function renderMovies(movies, total) {
            const list = document.getElementById('movieList');
            const emptyState = document.getElementById('emptyState');
            const resultInfo = document.getElementById('resultInfo');
            
            if (!movies || movies.length === 0) {
                list.innerHTML = '';
                list.classList.add('hidden');
                emptyState.classList.remove('hidden');
                if (!resultInfo.innerHTML.includes('AI')) {
                    resultInfo.innerHTML = '';
                }
                return;
            }

            list.classList.remove('hidden');
            emptyState.classList.add('hidden');
            
            if (!resultInfo.innerHTML.includes('AI')) {
                resultInfo.innerHTML = `找到 <strong class="text-indigo-600">${total}</strong> 部电影`;
            }

            list.innerHTML = movies.map(movie => `
                <div class="movie-card bg-white rounded-xl shadow-lg overflow-hidden" onclick="showMovieDetail(${movie.id})">
                    ${movie.cover_url ? `
                    <div class="relative">
                        <img 
                            src="${movie.cover_url}" 
                            alt="${movie.title}"
                            class="movie-cover"
                            onerror="handleImageError(this)"
                        >
                        <div class="movie-cover-placeholder img-error">🎬</div>
                        <div class="absolute top-2 right-2">
                            <span class="rating-badge text-white px-3 py-1 rounded-full font-bold text-sm shadow-lg">
                                ⭐ ${movie.rating || 'N/A'}
                            </span>
                        </div>
                        <div class="absolute top-2 left-2">
                            <span class="text-xs font-bold px-3 py-1 bg-white bg-opacity-90 text-indigo-700 rounded-full backdrop-blur">
                                ${movie.source ? movie.source.toUpperCase() : 'N/A'}
                            </span>
                        </div>
                    </div>
                    ` : `
                    <div class="relative">
                        <div class="movie-cover-placeholder">🎬</div>
                        <div class="absolute top-2 right-2">
                            <span class="rating-badge text-white px-3 py-1 rounded-full font-bold text-sm shadow-lg">
                                ⭐ ${movie.rating || 'N/A'}
                            </span>
                        </div>
                        <div class="absolute top-2 left-2">
                            <span class="text-xs font-bold px-3 py-1 bg-white bg-opacity-90 text-indigo-700 rounded-full backdrop-blur">
                                ${movie.source ? movie.source.toUpperCase() : 'N/A'}
                            </span>
                        </div>
                    </div>
                    `}
                    
                    <div class="p-4">
                        <h3 class="text-lg font-bold text-gray-800 mb-2 line-clamp-2 min-h-[3.5rem]">
                            ${movie.title}
                        </h3>
                        <div class="space-y-2 text-sm">
                            <p class="text-gray-600">
                                📅 <span class="font-medium">${movie.year || '未知年份'}</span>
                            </p>
                            ${movie.rating_count ? `
                            <p class="text-gray-600">
                                🔥 <span class="font-medium">${movie.rating_count.toLocaleString()} 人评分</span>
                            </p>
                            ` : ''}
                            ${movie.director ? `
                            <p class="text-gray-600 line-clamp-1">
                                🎬 <span class="font-medium">${movie.director}</span>
                            </p>
                            ` : ''}
                        </div>
                    </div>
                    
                    <div class="px-4 pb-4">
                        <button 
                            onclick="event.stopPropagation(); window.open('${movie.url || '#'}', '_blank')"
                            class="w-full bg-indigo-500 hover:bg-indigo-600 text-white py-2 rounded-lg font-medium transition ${!movie.url ? 'opacity-50 cursor-not-allowed' : ''}"
                            ${!movie.url ? 'disabled' : ''}
                        >
                            ${movie.url ? '🔗 访问源网站' : '暂无链接'}
                        </button>
                    </div>
                </div>
            `).join('');
        }

        function renderPagination(data) {
            const pagination = document.getElementById('pagination');
            
            // 如果总页数小于等于1，清空分页控件
            if (data.total_pages <= 1) {
                pagination.innerHTML = '';
                return;
            }

            pagination.innerHTML = `
                <button 
                    onclick="fetchMovies(${data.page - 1})" 
                    class="pagination-btn px-6 py-3 bg-white rounded-lg shadow hover:shadow-md transition font-medium ${data.page <= 1 ? 'opacity-50 cursor-not-allowed' : 'hover:bg-indigo-50'}"
                    ${data.page <= 1 ? 'disabled' : ''}
                >
                    ⬅️ 上一页
                </button>
                
                <div class="px-6 py-3 bg-white rounded-lg shadow font-medium">
                    第 <span class="text-indigo-600 font-bold">${data.page}</span> / 
                    <span class="text-gray-600">${data.total_pages}</span> 页
                </div>
                
                <button 
                    onclick="fetchMovies(${data.page + 1})" 
                    class="pagination-btn px-6 py-3 bg-indigo-500 text-white rounded-lg shadow hover:shadow-md transition font-medium ${data.page >= data.total_pages ? 'opacity-50 cursor-not-allowed' : 'hover:bg-indigo-600'}"
                    ${data.page >= data.total_pages ? 'disabled' : ''}
                >
                    下一页 ➡️
                </button>
            `;
        }

        async function showMovieDetail(movieId) {
            const modal = document.getElementById('movieModal');
            const modalBody = document.getElementById('modalBody');
            
            modalBody.innerHTML = '<div class="text-center py-8"><div class="inline-block animate-spin rounded-full h-8 w-8 border-4 border-indigo-500 border-t-transparent"></div></div>';
            modal.classList.add('active');

            try {
                const response = await fetch(`${API_BASE_URL}/movies/${movieId}`);
                const movie = await response.json();

                if (response.ok) {
                    modalBody.innerHTML = `
                        <div class="space-y-6">
                            ${movie.cover_url ? `
                            <div class="w-full flex justify-center">
                                <img 
                                    src="${movie.cover_url}" 
                                    alt="${movie.title}"
                                    class="rounded-xl shadow-lg max-h-96 object-cover"
                                    onerror="this.style.display='none'"
                                >
                            </div>
                            ` : ''}
                            
                            <div>
                                <h3 class="text-3xl font-bold text-gray-800 mb-3">${movie.title}</h3>
                                <div class="flex flex-wrap gap-3">
                                    ${movie.rating ? `<span class="rating-badge text-white px-4 py-2 rounded-full font-bold text-lg">⭐ ${movie.rating}</span>` : ''}
                                    ${movie.year ? `<span class="bg-gray-200 text-gray-700 px-4 py-2 rounded-full font-medium">📅 ${movie.year}</span>` : ''}
                                    ${movie.source ? `<span class="bg-indigo-100 text-indigo-700 px-4 py-2 rounded-full font-medium">📱 ${movie.source.toUpperCase()}</span>` : ''}
                                </div>
                                ${movie.rating_count ? `<p class="mt-2 text-gray-600">🔥 <strong>${movie.rating_count.toLocaleString()}</strong> 人评分</p>` : ''}
                            </div>

                            ${movie.director ? `
                            <div class="bg-gray-50 p-4 rounded-lg">
                                <h4 class="font-bold text-gray-700 mb-2">🎬 导演</h4>
                                <p class="text-gray-600">${movie.director}</p>
                            </div>
                            ` : ''}

                            ${movie.stars ? `
                            <div class="bg-gray-50 p-4 rounded-lg">
                                <h4 class="font-bold text-gray-700 mb-2">🌟 主演</h4>
                                <p class="text-gray-600">${movie.stars}</p>
                            </div>
                            ` : ''}

                            ${movie.summary ? `
                            <div class="bg-gray-50 p-4 rounded-lg">
                                <h4 class="font-bold text-gray-700 mb-2">📝 剧情简介</h4>
                                <p class="text-gray-600 leading-relaxed">${movie.summary}</p>
                            </div>
                            ` : ''}

                            ${movie.url ? `
                            <div class="flex gap-3">
                                <a 
                                    href="${movie.url}" 
                                    target="_blank"
                                    class="flex-1 bg-indigo-500 hover:bg-indigo-600 text-white text-center py-3 rounded-lg font-semibold transition"
                                >
                                    🔗 访问 ${movie.source ? movie.source.toUpperCase() : ''} 查看更多
                                </a>
                            </div>
                            ` : ''}

                            ${movie.created_at ? `
                            <div class="text-center text-sm text-gray-500 pt-4 border-t">
                                数据创建时间: ${new Date(movie.created_at).toLocaleString('zh-CN')}
                            </div>
                            ` : ''}
                        </div>
                    `;
                } else {
                    modalBody.innerHTML = `<div class="text-center py-8 text-red-600">❌ ${movie.detail || '加载失败'}</div>`;
                }
            } catch (error) {
                modalBody.innerHTML = `<div class="text-center py-8 text-red-600">❌ 网络错误: ${error.message}</div>`;
            }
        }

        function closeModal() {
            document.getElementById('movieModal').classList.remove('active');
        }

        document.getElementById('movieModal').addEventListener('click', function(event) {
            if (event.target === this) {
                closeModal();
            }
        });

        document.addEventListener('keydown', function(event) {
            if (event.key === 'Escape') {
                closeModal();
            }
        });

        function showLoading(show) {
            const loading = document.getElementById('loading');
            const movieList = document.getElementById('movieList');
            const pagination = document.getElementById('pagination');
            
            if (show) {
                loading.classList.remove('hidden');
                movieList.classList.add('hidden');
                pagination.innerHTML = '';
            } else {
                loading.classList.add('hidden');
            }
        }

        function showError(message) {
            const resultInfo = document.getElementById('resultInfo');
            resultInfo.innerHTML = `<span class="text-red-600">❌ ${message}</span>`;
            document.getElementById('movieList').innerHTML = '';
            document.getElementById('emptyState').classList.remove('hidden');
        }
    </script>
</body>
</html>
