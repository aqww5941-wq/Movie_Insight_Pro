map $http_upgrade $connection_upgrade {
    default upgrade;
    '' close;
}

server {
    listen 80;
    server_name localhost;
    resolver 127.0.0.11 valid=10s ipv6=off;

    # 1. 前端静态页面
    location / {
        root /usr/share/nginx/html;
        index index.html;
        # 这一行很重要：支持单页路由，防止刷新页面 404
        try_files $uri $uri/ /index.html;
    }

    # 静态资源缓存优化（按需可调）
    location ~* \.(?:css|js|mjs|ico|png|jpg|jpeg|gif|svg|woff2?)$ {
        root /usr/share/nginx/html;
        expires 7d;
        add_header Cache-Control "public, max-age=604800, immutable";
        access_log off;
        try_files $uri =404;
    }

    # 2. 后端 API 转发
    location /api/ {
        # 注意：末尾的斜杠决定了转发时是否带 /api 路径
        # 加上斜杠后，前端访问 /api/chat，后端收到的是 /chat
        set $api_upstream backend:8000;
        rewrite ^/api/(.*)$ /$1 break;
        proxy_pass http://$api_upstream;

        # 代理协议与连接优化
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $connection_upgrade;
        
        # 标准请求头转发
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # 🔥 关键：针对 AI 响应的超时优化
        # AI 生成回复可能需要较长时间，这里设置 60 秒防止连接中断
        proxy_read_timeout 60s;
        proxy_connect_timeout 60s;
        proxy_send_timeout 60s;
        proxy_buffering off;

        # 解决跨域限制（同域可不需要，如需跨域可按需开启）
        # add_header 'Access-Control-Allow-Origin' '*';
    }

    # 3. (可选) 开启 Gzip 压缩，让你的前端加载得飞快
    gzip on;
    gzip_types text/plain text/css application/json application/javascript text/xml;
    gzip_min_length 1024;
    gzip_vary on;
    gzip_proxied any;
}
