map $http_upgrade $connection_upgrade {
    default upgrade;
    '' close;
}

server {
    listen 80;
    server_name localhost;
    resolver 127.0.0.11 valid=10s ipv6=off;

    # 0. Swagger / OpenAPI 文档
    # 说明：
    # - 由于后端 FastAPI 的 Swagger 页面会引用绝对路径 /docs/* 和 /openapi.json
    # - 如果仅把 /api/ 转发给后端，而 / 由前端静态站点接管，会导致 /api/docs 页面资源 404
    # - 这里显式把 /docs、/redoc、/openapi.json 也转发到后端，并用 ^~ 防止被静态资源正则 location 抢占
    location ^~ /docs {
        set $api_upstream backend:8000;
        proxy_pass http://$api_upstream;

        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $connection_upgrade;

        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location ^~ /redoc {
        set $api_upstream backend:8000;
        proxy_pass http://$api_upstream;

        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $connection_upgrade;

        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location = /openapi.json {
        set $api_upstream backend:8000;
        proxy_pass http://$api_upstream;

        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $connection_upgrade;

        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # 1. 前端静态页面
    location / {
        root /usr/share/nginx/html;
        index index.html;
        # 这一行很重要：支持单页路由，防止刷新页面 404
        try_files $uri $uri/ /index.html;
    }

    # 静态资源缓存优化（按需可调）
    location ~* \.(?:css|js|mjs|ico|png|jpg|jpeg|gif|svg|woff2?)$ {
        root /usr/share/nginx/html;
        expires 7d;
        add_header Cache-Control "public, max-age=604800, immutable";
        access_log off;
        try_files $uri =404;
    }

    # 2. AI 流式接口（SSE）单独代理，避免被压缩/缓冲影响
    location = /api/agent/chat/stream {
        set $api_upstream backend:8000;
        rewrite ^/api/(.*)$ /$1 break;
        proxy_pass http://$api_upstream;

        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "";

        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        proxy_read_timeout 240s;
        proxy_connect_timeout 240s;
        proxy_send_timeout 240s;
        proxy_buffering off;
        proxy_request_buffering off;
        proxy_cache off;
        gzip off;
        chunked_transfer_encoding on;
        add_header X-Accel-Buffering no always;
    }

    # 2.1 AI 非流式接口（长耗时 ReAct）单独代理，避免长请求在回包前被断开
    location = /api/agent/chat {
        set $api_upstream backend:8000;
        rewrite ^/api/(.*)$ /$1 break;
        proxy_pass http://$api_upstream;

        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "";

        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        proxy_read_timeout 600s;
        proxy_connect_timeout 120s;
        proxy_send_timeout 600s;
        send_timeout 600s;
        proxy_buffering off;
        proxy_request_buffering off;
        proxy_cache off;
        gzip off;
    }

    # 3. 后端 API 转发
    location /api/ {
        # 注意：末尾的斜杠决定了转发时是否带 /api 路径
        # 加上斜杠后，前端访问 /api/chat，后端收到的是 /chat
        set $api_upstream backend:8000;
        rewrite ^/api/(.*)$ /$1 break;
        proxy_pass http://$api_upstream;

        # 代理协议与连接优化
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $connection_upgrade;
        
        # 标准请求头转发
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # 🔥 关键：针对 AI 响应的超时优化
        # 多意图 + 流式响应场景耗时更长，适当放宽代理超时
        proxy_read_timeout 180s;
        proxy_connect_timeout 180s;
        proxy_send_timeout 180s;
        proxy_buffering off;

        # 解决跨域限制（同域可不需要，如需跨域可按需开启）
        # add_header 'Access-Control-Allow-Origin' '*';
    }

    # 4. (可选) 开启 Gzip 压缩，让你的前端加载得飞快
    gzip on;
    gzip_types text/plain text/css application/json application/javascript text/xml;
    gzip_min_length 1024;
    gzip_vary on;
    gzip_proxied any;
}
